[package]
name = "xmip-core-contract-graphql-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-contract-graphql-schema"
description = "GraphQL schema content contract: a sound document always, held at the root to a bound schema when a Location names one. A xmip-core-contract technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Contract trait and its value types live there.
# Standard library otherwise, and codec's character reader: GraphQL is tokens
# and braces.
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main", optional = true }
# The settings this technology declares (xcore::settings), read through
# contract::ContractFactory (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main", optional = true }
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }

[features]
# The code and its declaration: the contract guide,
# module/core/capability/contract/doc/adding-a-contract.md.
default = ["declaration", "dep:contract", "dep:stream", "dep:codec"]
# The declaration alone.
declaration = []

[dev-dependencies]
# The parent's Stream fixture, for the tests only (ADR-0044).
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main", features = ["test-support"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { package = "xmip-core-library-file", git = "https://github.com/IlleNilsson/xmip-core-library-file", branch = "main", features = ["test-support"] }

[lints]
workspace = true
